name: Mobile Appium E2E Automation & Excel Reporting

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  mobile-e2e:
    name: Run Appium Mobile E2E (1,111 Android Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium E2E Dependencies
        run: |
          cd ErouteAppium
          npm ci || npm install

      - name: Execute Appium Mobile E2E Suite (1,111 Tests)
        run: |
          cd ErouteAppium
          npm test

      - name: Upload Appium Excel Analysis Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Appium-Mobile-E2E-Excel-Report
          path: ErouteAppium/appium-report.xlsx
          retention-days: 30

      - name: Upload Appium HTML Execution Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Appium-Mobile-E2E-HTML-Report
          path: ErouteAppium/execution-report.html
          retention-days: 30
