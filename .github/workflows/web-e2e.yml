name: Web Selenium E2E Automation & Excel Reporting

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  web-e2e:
    name: Run Selenium Web E2E (1,100 Assertions)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ErouteE2E/package-lock.json

      - name: Install E2E Dependencies
        run: |
          cd ErouteE2E
          npm ci || npm install

      - name: Start Vite Preview Server
        run: |
          npm ci || npm install
          npm run build
          npx vite preview --port 5173 --host 127.0.0.1 &
          sleep 4
          curl -I http://127.0.0.1:5173 || exit 1

      - name: Run Web Selenium E2E Suite (1,100 Tests)
        run: |
          cd ErouteE2E
          npm test

      - name: Upload Selenium Excel Analysis Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-Web-E2E-Excel-Report
          path: ErouteE2E/selenium-report.xlsx
          retention-days: 30

      - name: Upload Selenium HTML Execution Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-Web-E2E-HTML-Report
          path: ErouteE2E/execution-report.html
          retention-days: 30
